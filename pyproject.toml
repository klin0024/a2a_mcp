[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a2a-mcp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "google-adk",
    "google-adk[a2a]",
    "fastmcp",
    "python-dotenv",
    "pydantic-settings",
    "langchain",
    "langchain-google-genai",
    "langchain-mcp-adapters",
    # a2a-sdk 1.x 改了 API（a2a.client.helpers 等被移除），services/a2a_agent_tool_service.py 是照 0.3 寫的
    "a2a-sdk<1",
    # mcp 2.x 跟 langchain-mcp-adapters 不相容（mcp.shared.context.RequestContext 被移除）
    "mcp<2",
]

[tool.setuptools.packages.find]
where = ["src"]
