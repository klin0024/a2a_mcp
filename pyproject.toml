[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a2a-mcp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "google-adk",
    "google-adk[a2a]",
    "fastmcp",
    "python-dotenv",
    "pydantic-settings",
    "langchain",
    "langchain-google-genai",
    "langchain-mcp-adapters",
]

[tool.setuptools.packages.find]
where = ["src"]
